# docker-compose.yml — local dev workflow for demgis.
#
# Volumes (note container HOME is /home/demgis — non-root user, required by
# claude --dangerously-skip-permissions):
#   .:/workspace                              the repo (live; edits persist)
#   ${DEM_DATA}:/data                         raw Copernicus tile cache (RO)
#   ${OVERFLOW_TILES}/dem_tiles_overflow:/data_overflow:ro
#                                              optional: laptop overflow tile
#                                              dir (see project_tile_cache_
#                                              overflow). Falls back to a
#                                              placeholder if OVERFLOW_TILES
#                                              isn't set in .env.
#   ${STL_OUT:-./outputs}:/outputs            generated STLs (gitignored)
#   ${HOME}/.claude:/home/demgis/.claude      Claude Code auth state directory
#   ${HOME}/.claude.json:/home/demgis/.claude.json
#                                              Claude Code project state file
#                                              (must be a separate mount —
#                                              the .json sits next to the
#                                              .claude dir, not inside it)
#   ${HOME}/.gitconfig:/home/demgis/.gitconfig:ro
#                                              host git identity → in-container
#                                              commits attribute to the same
#                                              user (read-only)
#
# Set in .env file at the repo root, e.g.:
#   DEM_DATA=/Volumes/gray/DEM
#   OVERFLOW_TILES=/Users/tfoss   (parent of dem_tiles_overflow/)
#
# Quick reference:
#   docker compose build            (re)build the image
#   docker compose run --rm demgis bash       interactive shell
#   docker compose run --rm demgis python3 make_pilot.py --countries Iceland
#   ./claude-in-docker.sh           interactive agent w/ skip-permissions

services:
  demgis:
    build: .
    image: demgis:latest
    container_name: demgis
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      # Make matplotlib non-interactive by default in container (no display)
      MPLBACKEND: Agg
    volumes:
      - .:/workspace
      - ${DEM_DATA:-./_no_dem_data_set}:/data:ro
      - ${OVERFLOW_TILES:-./_no_overflow_set}/dem_tiles_overflow:/data_overflow:ro
      - ${STL_OUT:-./outputs}:/outputs
      - ${HOME}/.claude:/home/demgis/.claude
      - ${HOME}/.claude.json:/home/demgis/.claude.json
      # Host git identity (user.name, user.email, signing key, etc.) so
      # in-container commits attribute to the same person as host commits.
      # Read-only so an in-container `git config` can't surprise the host
      # config. The container has no ~/.gitconfig of its own and no gh
      # CLI, so this mount is the canonical identity source.
      - ${HOME}/.gitconfig:/home/demgis/.gitconfig:ro
      # Mac host fonts (read-only). country_label.py looks here first
      # for proprietary fonts the user has licensed locally (Futura,
      # Avenir Next, Helvetica Neue, etc.). Optional — falls back to
      # the bundled Montserrat-Regular.ttf if these paths don't exist
      # (Linux hosts won't have them; mount points still resolve).
      - ${HOME}/Library/Fonts:/host_fonts:ro
      - ${MAC_SYSTEM_FONTS:-./_no_mac_system_fonts}:/host_system_fonts:ro
      # Persist conda pkgs cache so rebuilds reuse downloaded packages
      - demgis-conda-pkgs:/opt/conda/pkgs

volumes:
  demgis-conda-pkgs:
